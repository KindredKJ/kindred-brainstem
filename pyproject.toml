[project]
name = "kindred-brainstem"
version = "0.1.0a0"
description = "Kindred BRAINSTEM cognitive model with native governed DCML."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "cryptography>=46.0.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.0",
    "pytest>=8.2.0",
    "ruff>=0.16.0"
]

[project.scripts]
kindred = "brainstem.cli.app:app"
brainstem = "brainstem.cli.app:app"
bstem = "brainstem.cli.app:app"
kbs = "brainstem.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainstem*"]
exclude = [
    "data*",
    "config*",
    "products*",
    "generated*",
    "tests*"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]

[build-system]
requires = []
build-backend = "brainstem_build_backend"
backend-path = ["."]
