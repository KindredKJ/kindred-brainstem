[project]
name = "kindred-brainstem"
version = "0.1.0"
description = "BRAINSTEM: From Signal to Infrastructure. Kindred Labs autonomous production factory."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
brainstem = "brainstem.cli.app:app"

[build-system]
requires = []
build-backend = "brainstem_build_backend"
backend-path = ["."]
